<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Alajlan Auto · Account</title>
<style>
  :root { --brand:#1a73e8; --bg:#f4f6fb; --card:#fff; --text:#1f2430; --muted:#6b7280; --err:#d93025; --ok:#188038; --border:#e2e6ef; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { font-family:'Segoe UI',Tahoma,Arial,sans-serif; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:24px; color:var(--text); }
  .card { background:var(--card); border:1px solid var(--border); border-radius:18px; box-shadow:0 12px 40px rgba(20,40,90,.08); padding:32px; width:100%; max-width:420px; }
  .logo { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .logo .dot { width:34px; height:34px; border-radius:10px; background:var(--brand); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px; }
  h1 { font-size:20px; margin:6px 0 2px; }
  p.sub { color:var(--muted); font-size:13px; margin:0 0 20px; }
  label { display:block; font-size:12px; font-weight:600; color:var(--muted); margin:12px 0 6px; }
  input { width:100%; padding:12px 14px; font-size:15px; border:1px solid var(--border); border-radius:10px; outline:none; }
  input:focus { border-color:var(--brand); box-shadow:0 0 0 3px rgba(26,115,232,.15); }
  button { width:100%; margin-top:20px; padding:13px; font-size:15px; font-weight:700; color:#fff; background:var(--brand); border:0; border-radius:10px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .msg { font-size:13px; margin-top:14px; padding:10px 12px; border-radius:8px; display:none; }
  .msg.err { display:block; background:rgba(217,48,37,.08); color:var(--err); }
  .msg.ok { display:block; background:rgba(24,128,56,.08); color:var(--ok); }
  .switch { font-size:12px; color:var(--brand); background:none; border:0; cursor:pointer; margin-top:14px; padding:0; }
  .switch:hover { text-decoration:underline; }
</style>
</head>
<body>
<div class="card">
  <div class="logo"><div class="dot">أ</div><span>Alajlan Auto</span></div>

  <h1 id="title">تفعيل الحساب</h1>
  <p class="sub" id="subtitle">اضبط كلمة المرور لتفعيل حسابك</p>

  <div id="formWrap">
    <label for="pw">كلمة المرور الجديدة</label>
    <input type="password" id="pw" autocomplete="new-password" />
    <label for="pw2">تأكيد كلمة المرور</label>
    <input type="password" id="pw2" autocomplete="new-password" />
    <button id="submit">حفظ</button>
  </div>

  <button class="switch" id="langSwitch">English</button>
  <div class="msg" id="msg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ── Build-time config (public publishable key — safe to expose) ──────────
  const SUPABASE_URL = "https://wimuplokspgnzgpmmacf.supabase.co";
  const SUPABASE_KEY = "sb_publishable_2cGXWmw94XERAqkruLDhfw_cqGcmxmk";

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const T = {
    ar: { titleAct:"تفعيل الحساب", subAct:"اضبط كلمة المرور لتفعيل حسابك",
          titleReset:"تغيير كلمة المرور", subReset:"أدخل كلمة مرورك الجديدة",
          titleBusy:"جاري التحميل…", subBusy:"يرجى الانتظار",
          titleDone:"تم بنجاح", subDone:"تم حفظ كلمة المرور. يمكنك الآن إغلاق هذه الصفحة والدخول من التطبيق.",
          subErr:"تعذّر التحقق من الرابط. قد يكون منتهي الصلاحية أو مستخدَم مسبقًا. أعد إرسال الدعوة/الرابط وحاول مجددًا.",
          subUnsupported:"هذا النوع من الروابط غير مدعوم من هذه الصفحة.",
          pwLabel:"كلمة المرور الجديدة", pw2Label:"تأكيد كلمة المرور",
          required:"الرجاء إدخال كلمة المرور", mismatch:"كلمتا المرور غير متطابقتين",
          weak:"كلمة المرور يجب أن تكون 6 أحرف على الأقل", busy:"…جاري الحفظ",
          save:"حفظ", lang:"English" },
    en: { titleAct:"Activate your account", subAct:"Set a password to activate your account",
          titleReset:"Change your password", subReset:"Enter your new password",
          titleBusy:"Loading…", subBusy:"Please wait",
          titleDone:"All set", subDone:"Your password was saved. You can close this page and sign in from the app.",
          subErr:"We couldn't verify this link. It may be expired or already used. Please request a new invite/link and try again.",
          subUnsupported:"This link type isn't supported by this page.",
          pwLabel:"New password", pw2Label:"Confirm password",
          required:"Please enter a password", mismatch:"Passwords do not match",
          weak:"Password must be at least 6 characters", busy:"Saving…",
          save:"Save", lang:"عربي" }
  };
  let t = T.ar;

  const $ = (id) => document.getElementById(id);
  let sessionType = null;   // 'invite' | 'recovery' | 'magiclink' | 'signup'
  let sessionReady = false;

  function lang(set){ t = set; apply(); }
  function apply(){
    const busy = !sessionReady;
    $("langSwitch").textContent = t.lang;
    $("title").textContent = busy ? t.titleBusy : (sessionType==='recovery'||sessionType==='magiclink' ? t.titleReset : t.titleAct);
    $("subtitle").textContent = busy ? t.subBusy : (sessionType==='recovery'||sessionType==='magiclink' ? t.subReset : t.subAct);
    $("pw").setAttribute("placeholder", t.pwLabel);
    $("pw2").setAttribute("placeholder", t.pw2Label);
    $("submit").textContent = t.save;
  }
  function msg(kind, text){ const el=$("msg"); el.className="msg "+kind; el.textContent=text; }
  function showErr(text){ const el=$("msg"); el.className="msg err"; el.textContent=text; }
  function hideMsg(){ const el=$("msg"); el.className="msg"; }

  // ── Link parsing (handles implicit fragment, token_hash & PKCE code) ─────
  async function handleLink(){
    const params = new URLSearchParams(window.location.search);
    const hash = new URLSearchParams(window.location.hash.replace(/^#/, ""));
    const type = params.get("type") || hash.get("type");

    try {
      // Newer flow: ?token_hash=...&type=invite|recovery|...
      const tokenHash = params.get("token_hash");
      if (tokenHash) {
        const { error } = await supabase.auth.verifyOtp({ type, token_hash: tokenHash });
        if (error) throw error;
        sessionType = type;
        sessionReady = true; apply();
        return;
      }
      // PKCE flow: ?code=...
      const code = params.get("code");
      if (code) {
        // The verifier lives in localStorage only when the flow started here;
        // for links opened fresh in a browser we fall back to implicit tokens.
        const { error } = await supabase.auth.exchangeCodeForSession(code);
        if (error) { /* PKCE verifier missing — rely on fragment below */ }
        sessionType = type || 'recovery';
        sessionReady = true; apply();
        return;
      }
      // Implicit/legacy flow: #access_token=...&refresh_token=...
      const accessToken = hash.get("access_token");
      const refreshToken = hash.get("refresh_token");
      if (accessToken) {
        await supabase.auth.setSession({
          access_token: accessToken,
          refresh_token: refreshToken,
        });
        sessionType = type || 'recovery';
        sessionReady = true; apply();
        return;
      }

      // No recognizable link — assume a plain visit of the page.
      sessionType = 'recovery';
      sessionReady = true;
      apply();
      hideMsg();
    } catch (e) {
      // Link failed: still show the form but saving will surface the error.
      sessionType = type || 'recovery';
      sessionReady = true;
      apply();
      showErr(t.subErr);
      console.error(e);
    }
  }

  async function save(){
    const pw = $("pw").value;
    const pw2 = $("pw2").value;
    hideMsg();
    if (!pw){ showErr(t.required); return; }
    if (pw.length < 6){ showErr(t.weak); return; }
    if (pw !== pw2){ showErr(t.mismatch); return; }
    const btn = $("submit");
    btn.disabled = true; btn.textContent = t.busy;
    try {
      const { error } = await supabase.auth.updateUser({ password: pw });
      if (error) throw error;
      const ok=$("msg"); ok.className="msg ok"; ok.textContent=t.subDone;
      $("formWrap").style.display="none";
      $("langSwitch").style.display="none";
      $("title").textContent=t.titleDone;
      $("subtitle").textContent=t.subDone;
    } catch (e) {
      showErr(e && e.message ? e.message : t.subErr);
      btn.disabled = false; btn.textContent = t.save;
    }
  }

  $("submit").addEventListener("click", save);
  $("langSwitch").addEventListener("click", () => lang(t===T.ar ? T.en : T.ar));
  $("pw").addEventListener("keydown", (e)=>{ if(e.key==="Enter") $("pw2").focus(); });
  $("pw2").addEventListener("keydown", (e)=>{ if(e.key==="Enter") save(); });

  handleLink();
</script>
</body>
</html>
